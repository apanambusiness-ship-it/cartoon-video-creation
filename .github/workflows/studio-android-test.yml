name: Android test build
on:
  push:
    branches: [main]
    paths: ['android/**', 'index.html', '*.css', '*.js', '*.jpg', '*.jpeg', '*.png', '*.svg', 'manifest.webmanifest', '.github/workflows/studio-android-test.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/studio-android-test.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare SDK and app icon
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
          mkdir -p android/app/src/main/res/drawable
          cp apanam-app-icon-192.png android/app/src/main/res/drawable/studio_icon.png
      - name: Validate Digital Asset Links generator
        run: |
          python3 android/scripts/assetlinks.py in.apanam.studio "$(python3 -c 'print(":".join(["AA"]*32))')" > /tmp/studio-assetlinks.json
          python3 -m json.tool /tmp/studio-assetlinks.json > /dev/null
          if python3 android/scripts/assetlinks.py in.apanam.studio INVALID > /dev/null 2>&1; then exit 1; fi
      - name: Build and lint test app
        run: gradle -p android assembleDebug bundleRelease lintDebug testDebugUnitTest testReleaseUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: APANAMai-Android-TEST-ONLY
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Prepare direct mobile APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" APANAM-AI-Studio.apk

      - name: Publish direct APK download
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view apanam-ai-studio-latest >/dev/null 2>&1 || \
            gh release create apanam-ai-studio-latest --title "APANAM AI Studio - Latest Android APK" --prerelease
          gh release upload apanam-ai-studio-latest APANAM-AI-Studio.apk --clobber

      - name: Verify release signing with disposable CI fixture
        run: bash android/scripts/signing-smoke.sh
