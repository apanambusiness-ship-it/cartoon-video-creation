name: Mobile editor layout review
on:
  push:
    branches: [fix/editor-mobile-layout]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-editor-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-editor-layout-preview
          path: quality-artifacts/editor-layout-*.png
          retention-days: 7
