name: Studio quality checks
on:
  push:
    branches: [main]
    paths:
      - '**.js'
      - '**.cjs'
      - '**.ts'
      - '**.sql'
      - '**.html'
      - '**.css'
      - '.github/workflows/studio-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-quality
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser test dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install exported media verifier
        run: sudo apt-get install --no-install-recommends -y ffmpeg
      - name: Check support and admin diagnostics
        run: |
          node tests/support-health-edge.cjs
          node tests/support-health-browser.cjs
      - name: Check phonetic fields and dialog drag
        run: node tests/phonetic-fields-browser.cjs
      - name: Check professional designs and photo blend
        run: node tests/professional-design-browser.cjs
      - name: Check mobile and desktop tool parity
        run: node tests/mobile-tool-parity-browser.cjs
      - name: Check account summary and receipts
        run: |
          node tests/account-summary-browser.cjs
          node tests/video-ready-stories-browser.cjs
      - name: Inspect every app page and popup
        run: node tests/app-layout-audit.cjs
      - name: Check Shubh voice integration
        run: |
          node tests/paid-voice-edit-race.cjs
          node tests/registration-autopay-edge.cjs
          node tests/registration-autopay-browser.cjs
          node tests/paid-integrations-edge.cjs
          node tests/paid-integrations-browser.cjs
          node tests/sarvam-voice-edge.cjs
          node tests/sarvam-voice-browser.cjs
          node tests/video-audio-draft-browser.cjs
          node tests/video-simple-workspace-browser.cjs
      - name: Check Hindi text audio and video
        run: node tests/video-text-audio-browser.cjs
      - name: Check photo stories and clip export
        run: |
          node tests/video-photo-clip-browser.cjs
      - name: Check contracts and cache
        run: |
          node tests/account-recovery-regression.cjs
          node tests/mobile-native-input-regression.cjs poster-editor-assets/touch-support.js
          node tests/video-format-regression.cjs
          node tests/voice-recording-regression.cjs
          node tests/export-format-regression.cjs
          node tests/service-worker-core-regression.cjs
          node --experimental-strip-types tests/studio-business-edge-regression.cjs
          node --experimental-strip-types tests/studio-payments-edge-regression.cjs
          node --experimental-strip-types tests/ai-payments-edge.cjs
          node --experimental-strip-types tests/payment-alerts-edge.cjs
      - name: Check mobile and offline editing
        run: |
          node tests/admin-payment-browser.cjs
          node tests/payment-return-browser.cjs
          node tests/current-studio-browser.cjs
          node tests/mobile-panels-browser.cjs
          node tests/original-gallery-browser.cjs
          node tests/touch-calendar-browser.cjs
          node tests/creative-library-browser.cjs
          node tests/ready-posters-browser.cjs
          node tests/ready-posters-live.cjs
      - name: Check business and private media UI
        run: |
          node tests/studio-business-browser.cjs
          node tests/ai-balance-browser.cjs
          node tests/poster-logo-export.cjs
      - name: Check full-length audible video
        run: node tests/video-long-export-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-quality-screenshots
          path: quality-artifacts/
          retention-days: 7


      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-layout-audit
          path: |
            quality-artifacts/audit-*.png
            quality-artifacts/app-layout-audit.json
          retention-days: 7
