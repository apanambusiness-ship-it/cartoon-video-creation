name: Calendar five editable designs
on:
  push:
    branches: [main]
    paths: ['studio-calendar.js', 'tests/calendar-five-designs.cjs', '.github/workflows/calendar-designs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node --check studio-calendar.js
      - run: node tests/calendar-five-designs.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-five-designs-preview
          path: quality-artifacts/calendar-five-*.png
          retention-days: 7
