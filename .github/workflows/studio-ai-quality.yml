name: Real browser AI models
on:
  push:
    branches: [main]
    paths:
      - 'object-ai-worker.js'
      - 'object-mask-utils.js'
      - 'tests/real-ai-model-browser.cjs'
      - '.github/workflows/studio-ai-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-ai-quality
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Download and run real models
        run: node tests/real-ai-model-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-real-ai-screenshots
          path: quality-artifacts/
          retention-days: 7
