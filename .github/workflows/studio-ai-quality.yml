name: Real browser AI models
on:
  push:
    branches: [main]
    paths:
      - 'object-ai-worker.js'
      - 'object-mask-utils.js'
      - 'tests/real-ai-model-browser.cjs'
      - 'tests/real-hindi-ocr-browser.cjs'
      - 'image-content-editor.js'
      - 'object-image-editor.js'
      - 'tests/real-photo-editor-browser.cjs'
      - '.github/workflows/studio-ai-quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-ai-quality
  cancel-in-progress: true
jobs:
  models:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser dependency
        run: npm install --no-save --package-lock=false playwright@1.55.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install Hindi test font
        run: |
          mkdir -p quality-artifacts
          curl --fail --location --globoff --retry 2 --connect-timeout 20 --max-time 90 'https://raw.githubusercontent.com/google/fonts/main/ofl/notosansdevanagari/NotoSansDevanagari%5Bwdth%2Cwght%5D.ttf' -o quality-artifacts/qa-hindi.ttf
      - name: Run real Hindi photo OCR
        run: node tests/real-hindi-ocr-browser.cjs
      - name: Download fixed natural-photo fixture
        run: curl --fail --location --retry 2 --connect-timeout 20 --max-time 90 'https://raw.githubusercontent.com/opencv/opencv/20e367198c7adde8f1efc0f525256b1e15798024/samples/data/fruits.jpg' -o quality-artifacts/qa-camera-fruits.jpg
      - name: Check camera photo selection and real repair
        run: node tests/real-photo-editor-browser.cjs
      - name: Download and run real models
        run: node tests/real-ai-model-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-real-ai-screenshots
          path: quality-artifacts/
          retention-days: 7

