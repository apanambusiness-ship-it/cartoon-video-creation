name: Home Search focus review
on:
  push:
    branches: [fix/home-search-only]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search-focus:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/home-search-focus.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-search-focus-review
          path: quality-artifacts/home-search-*.png
          retention-days: 7
