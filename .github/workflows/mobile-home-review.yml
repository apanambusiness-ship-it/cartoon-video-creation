name: Mobile Home button review
on:
  push:
    branches: [fix/mobile-home-routes, main]
    paths: ['studio-home.js', 'index.html', 'studio-home-stable.css', 'tests/mobile-home-routes.cjs', '.github/workflows/mobile-home-review.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-home:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-home-routes.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-home-review
          path: quality-artifacts/home-*.png
          retention-days: 7
