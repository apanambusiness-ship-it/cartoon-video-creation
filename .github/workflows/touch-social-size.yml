name: Touch text, phonetic panel and social poster sizes
on:
  push:
    branches: [main]
    paths: ['poster-editor-assets/app.js', 'social-poster-size.js', 'floating-text-edit.js', 'tests/touch-text-social-size.cjs', '.github/workflows/touch-social-size.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  touch-social:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/touch-text-social-size.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: touch-social-previews
          path: quality-artifacts/
          retention-days: 7
