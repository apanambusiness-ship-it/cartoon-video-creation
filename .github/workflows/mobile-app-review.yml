name: Mobile app review
on:
  pull_request:
  push:
    branches: [fix/mobile-app-audit-20261023]
permissions:
  contents: read
jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.55.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/mobile-native-input-regression.cjs
      - run: node tests/home-search-focus.cjs
      - run: node tests/mobile-app-review.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-app-review
          path: quality-artifacts/
          retention-days: 14
