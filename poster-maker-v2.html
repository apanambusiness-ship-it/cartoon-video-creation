<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APANAM Poster Maker V2</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#071426;color:#eaf2ff;overflow:hidden}header{height:66px;background:#071326;display:flex;align-items:center;padding:0 20px;border-bottom:1px solid #1e3a5f;gap:28px}.brand{font-size:24px;font-weight:900;color:#60a5fa}.brand small{display:block;font-size:12px;color:#fff;font-weight:500}.nav{display:flex;gap:8px}.nav button,.tool button,.right button,.bottom button{border:1px solid #29466b;background:#10233b;color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer}.nav .on,.primary{background:#087cf0!important}.app{display:grid;grid-template-columns:330px 1fr 300px;height:calc(100vh - 66px)}aside{background:#0b1a2c;border-right:1px solid #1f3857;padding:14px;overflow:auto}.right{border-left:1px solid #1f3857;border-right:0}.title{font-size:18px;font-weight:800;margin:5px 0 12px}.search{width:100%;padding:11px;background:#10243d;border:1px solid #2c496a;border-radius:7px;color:#fff}.cats{display:flex;gap:6px;overflow:auto;margin:10px 0}.cats button{white-space:nowrap;border:1px solid #29496e;background:#10243d;color:#dbeafe;padding:7px 9px;border-radius:7px}.cats .on{background:#087cf0}.templates{display:grid;grid-template-columns:1fr 1fr;gap:9px}.tpl{height:125px;border:2px solid transparent;border-radius:9px;overflow:hidden;position:relative;cursor:pointer;padding:10px;color:#fff;text-align:left}.tpl.on{border-color:#38bdf8}.tpl b{font-size:16px;display:block;max-width:90%}.tpl small{position:absolute;bottom:8px;left:8px;background:#06101dcc;padding:4px 6px;border-radius:5px}.workspace{background:#102036;display:flex;flex-direction:column;min-width:0}.tool{height:52px;display:flex;align-items:center;gap:8px;padding:7px 14px;background:#0b1a2c;border-bottom:1px solid #1e3858}.canvasWrap{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}.canvas{width:520px;height:520px;background:linear-gradient(145deg,#3b0718,#71122d);box-shadow:0 12px 40px #0008;position:relative;overflow:hidden}.el{position:absolute;cursor:move;user-select:none}.headline{left:60px;top:100px;width:400px;text-align:center;font-size:54px;font-weight:900;color:#ffd36a}.sub{left:70px;top:235px;width:380px;text-align:center;font-size:21px}.art{left:160px;top:315px;width:200px;height:120px;border-radius:60% 60% 20% 20%;background:radial-gradient(circle,#ffdb66,#e56b00 55%,#6b1500);box-shadow:0 0 40px #ff9d00}.bottom{height:58px;background:#0b1a2c;border-top:1px solid #1e3858;display:flex;justify-content:flex-end;align-items:center;gap:8px;padding:8px 14px}.right input,.right select,.right textarea{width:100%;background:#10243d;border:1px solid #29496e;color:#fff;border-radius:7px;padding:9px;margin:5px 0 10px}.group{border-top:1px solid #203c5d;padding:12px 0}.row{display:flex;gap:7px}.row>*{flex:1}.note{font-size:11px;color:#9fb5ce}@media(max-width:900px){.app{grid-template-columns:250px 1fr}.right{display:none}.canvas{transform:scale(.8)}header .nav{display:none}}</style></head><body><header><div class="brand">APANAM<small>AI Creative Studio</small></div><div class="nav"><button>Home</button><button class="on">Poster Maker</button><button>AI Image</button><button>Cartoon Video</button><button>AI Audio</button><button id="galleryBtn">Templates</button><button>My Projects</button></div></header><div class="app"><aside><div class="title">🎨 Templates & Themes</div><input id="search" class="search" placeholder="Search templates..."><div class="cats" id="cats"></div><div class="templates" id="templates"></div></aside><main class="workspace"><div class="tool"><button>File⌄</button><button id="undo">↶</button><button id="redo">↷</button><button>100%⌄</button><button id="addText">T Text</button><button id="addImage">▧ Image</button><input id="imageInput" type="file" accept="image/*" hidden></div><div class="canvasWrap"><div class="canvas" id="canvas"><div class="el headline" data-type="text">शुभ दीपावली</div><div class="el sub" data-type="text">आपको और आपके परिवार को हार्दिक शुभकामनाएँ</div><div class="el art" data-type="shape"></div></div></div><div class="bottom"><button id="use">Use This Template</button><button id="save">Save Project</button><button class="primary" id="download">Download</button></div></main><aside class="right"><div class="title">Edit Selected</div><div class="row"><button class="primary">Text</button><button>Image</button><button>Shape</button></div><div class="group"><label>Text</label><textarea id="textEdit" rows="3"></textarea><label>Font</label><select id="font"><option>Arial</option><option>Georgia</option><option>Verdana</option><option>Tahoma</option><option>Trebuchet MS</option><option>serif</option><option>sans-serif</option></select><label>Size</label><input id="size" type="range" min="10" max="140" value="54"><label>Color</label><input id="color" type="color" value="#ffd36a"><div class="row"><button id="bold"><b>B</b></button><button id="left">≡←</button><button id="center">≡</button><button id="right">→≡</button></div></div><div class="group"><button id="duplicate">Duplicate</button> <button id="del">Delete</button></div><p class="note">Template चुनें → canvas पर खुलेगा → element पर click करके text, size, color बदलें।</p></aside></div><script>const data=[['Festival','शुभ दीपावली','#4b0618','#b91c1c'],['Business','GROW YOUR BUSINESS','#071827','#146c94'],['Food','Delicious Food','#151515','#8a5b13'],['Birthday','Happy Birthday','#f59eaa','#7c3aed'],['Wedding','Wedding Invitation','#7f1d1d','#d4a24c'],['Education','LEARN TODAY','#083d77','#f5b700'],['Political','जन सेवा हमारी पहचान','#f8fafc','#f97316'],['Beauty','Natural Beauty','#f6d7ce','#8b5e3c'],['Sale','MEGA SALE','#dc2626','#facc15'],['Social','FOLLOW US','#7c3aed','#ec4899']];let active='All',selected=null,history=[];const cats=document.getElementById('cats'),templates=document.getElementById('templates'),canvas=document.getElementById('canvas');['All',...new Set(data.map(x=>x[0]))].forEach(c=>{let b=document.createElement('button');b.textContent=c;b.className=c==='All'?'on':'';b.onclick=()=>{active=c;[...cats.children].forEach(x=>x.classList.toggle('on',x===b));render()};cats.appendChild(b)});function render(){let q=search.value.toLowerCase();templates.innerHTML='';data.filter(x=>(active==='All'||x[0]===active)&&x.join(' ').toLowerCase().includes(q)).forEach((x,i)=>{let b=document.createElement('button');b.className='tpl';b.style.background=`linear-gradient(145deg,${x[2]},${x[3]})`;b.innerHTML=`<b>${x[1]}</b><small>${x[0]}</small>`;b.onclick=()=>apply(x,b);templates.appendChild(b)})}function snap(){history.push(canvas.innerHTML);if(history.length>30)history.shift()}function apply(x,b){snap();canvas.style.background=`linear-gradient(145deg,${x[2]},${x[3]})`;canvas.innerHTML=`<div class="el headline" data-type="text">${x[1]}</div><div class="el sub" data-type="text">अपना संदेश यहाँ लिखें</div><div class="el art" data-type="shape"></div>`;[...templates.children].forEach(y=>y.classList.toggle('on',y===b));wire()}function select(e){selected=e;document.querySelectorAll('.el').forEach(x=>x.style.outline='');e.style.outline='2px solid #38bdf8';if(e.dataset.type==='text'){textEdit.value=e.textContent;size.value=parseInt(getComputedStyle(e).fontSize);color.value=rgbhex(getComputedStyle(e).color)}}function rgbhex(c){let m=c.match(/\d+/g);return m?'#'+m.slice(0,3).map(x=>(+x).toString(16).padStart(2,'0')).join(''):'#ffffff'}function wire(){canvas.querySelectorAll('.el').forEach(e=>{e.onclick=ev=>{ev.stopPropagation();select(e)};e.onpointerdown=ev=>{if(ev.button!==0)return;select(e);let sx=ev.clientX,sy=ev.clientY,l=e.offsetLeft,t=e.offsetTop;e.setPointerCapture(ev.pointerId);e.onpointermove=v=>{e.style.left=l+v.clientX-sx+'px';e.style.top=t+v.clientY-sy+'px'};e.onpointerup=()=>{e.onpointermove=null;snap()}}})}textEdit.oninput=()=>{if(selected?.dataset.type==='text')selected.textContent=textEdit.value};size.oninput=()=>{if(selected)selected.style.fontSize=size.value+'px'};color.oninput=()=>{if(selected)selected.style.color=color.value};font.onchange=()=>{if(selected)selected.style.fontFamily=font.value};bold.onclick=()=>{if(selected)selected.style.fontWeight=selected.style.fontWeight==='400'?'900':'400'};left.onclick=()=>selected&&(selected.style.textAlign='left');center.onclick=()=>selected&&(selected.style.textAlign='center');right.onclick=()=>selected&&(selected.style.textAlign='right');del.onclick=()=>{if(selected){snap();selected.remove();selected=null}};duplicate.onclick=()=>{if(selected){snap();let n=selected.cloneNode(true);n.style.left=selected.offsetLeft+20+'px';n.style.top=selected.offsetTop+20+'px';canvas.appendChild(n);wire()}};addText.onclick=()=>{snap();let e=document.createElement('div');e.className='el';e.dataset.type='text';e.textContent='आपका टेक्स्ट';Object.assign(e.style,{left:'120px',top:'180px',fontSize:'38px',color:'#fff'});canvas.appendChild(e);wire();select(e)};addImage.onclick=()=>imageInput.click();imageInput.onchange=()=>{let f=imageInput.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{snap();let im=document.createElement('img');im.src=r.result;im.className='el';im.dataset.type='image';Object.assign(im.style,{left:'140px',top:'150px',width:'220px'});canvas.appendChild(im);wire()};r.readAsDataURL(f)};save.onclick=()=>localStorage.setItem('apanamV2',JSON.stringify({html:canvas.innerHTML,bg:canvas.style.background}));use.onclick=()=>alert('Template editor में खुल गया है — अब Text/Image/Color edit करें।');download.onclick=()=>alert('V2 सुरक्षित preview में है। Existing editor का export अभी main version में उपलब्ध है।');galleryBtn.onclick=()=>document.querySelector('aside').scrollTo({top:0,behavior:'smooth'});search.oninput=render;canvas.onclick=()=>{selected=null;canvas.querySelectorAll('.el').forEach(x=>x.style.outline='')};render();wire();</script></body></html>
