<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APANAM Original Templates</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f5f3ff;color:#171717}.wrap{max-width:1000px;margin:auto;padding:18px}.top{background:linear-gradient(135deg,#4c1d95,#7c3aed);color:#fff;padding:20px;border-radius:18px}.search{width:100%;box-sizing:border-box;padding:13px;margin:14px 0;border:1px solid #ccc;border-radius:10px}.cats{display:flex;gap:8px;overflow:auto}.cats button,.nav button,.use{padding:10px 15px;border:0;border-radius:20px;cursor:pointer}.cats .on,.use{background:#6d28d9;color:#fff}.card{margin-top:15px;background:#fff;border:2px solid #7c3aed;border-radius:18px;padding:14px;box-shadow:0 8px 25px #0002}.poster{max-width:520px;margin:auto;aspect-ratio:1/1;background:#111 center/cover no-repeat;border-radius:15px;display:flex;align-items:end;overflow:hidden}.caption{width:100%;padding:20px;color:#fff;background:linear-gradient(transparent,#000c)}.caption h2{font-size:32px;margin:0}.nav{display:flex;justify-content:center;gap:12px;align-items:center;margin:14px}.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}.controls select,.controls input{padding:10px;border-radius:9px;border:1px solid #bbb}.basic{margin-top:24px;padding:18px;background:#fff;border-radius:15px}a{color:inherit}.count{font-weight:700}</style></head><body><div class="wrap"><div class="top"><h1>🎨 APANAM Original Templates</h1><p>Professional Original Poster Gallery • 100 Templates • Free Size • Use & Edit</p></div><input id="q" class="search" placeholder="Search templates..."><div id="cats" class="cats"></div><div class="card"><div id="poster" class="poster"><div class="caption"><h2 id="title"></h2><p id="sub"></p></div></div><div class="nav"><button id="prev">‹ Previous</button><span id="counter" class="count"></span><button id="next">Next ›</button></div><div class="controls"><select id="size"><option>1080 × 1080</option><option>1080 × 1350</option><option>1080 × 1920</option><option>1920 × 1080</option><option>Free Size</option></select><input id="custom" placeholder="Custom W × H"><button id="use" class="use">Use & Edit</button></div></div><div class="basic"><h2>✏️ Basic Editable Templates</h2><p>Original gallery ऊपर अलग रखी गई है। पुराने/basic editor templates इसके नीचे अलग रहेंगे।</p><a href="./">← Main Editor</a></div></div><script>const cats=['Festival','Wedding','Business','Food','Birthday','Education','Travel','Beauty','Social Media','Health','Political','Religious','Real Estate','Fashion','Handmade','Technology'];const names=['Premium','Royal','Modern','Classic','Elegant','Creative','Special'];const themes={Festival:['#7f1d1d','#f59e0b'],Wedding:['#831843','#f9a8d4'],Business:['#082f49','#22c55e'],Food:['#431407','#fb923c'],Birthday:['#581c87','#ec4899'],Education:['#075985','#facc15'],Travel:['#164e63','#2dd4bf'],Beauty:['#831843','#f9a8d4'],'Social Media':['#4c1d95','#fb7185'],Health:['#14532d','#a3e635'],Political:['#166534','#fb923c'],Religious:['#7c2d12','#fbbf24'],'Real Estate':['#0f172a','#38bdf8'],Fashion:['#3f3f46','#f472b6'],Handmade:['#713f12','#84cc16'],Technology:['#172554','#60a5fa']};let all=[];for(let i=0;i<100;i++){let c=cats[i%cats.length],n=names[Math.floor(i/cats.length)%names.length],co=themes[c];all.push({cat:c,name:c+' '+n+' '+(i+1),title:c.toUpperCase()+' '+n.toUpperCase(),sub:'APANAM Professional Original • '+(i+1)+'/100',bg:`linear-gradient(135deg,${co[0]},${co[1]})`})}all[0]={cat:'Festival',name:'Durga Puja Premium',title:'शुभ दुर्गा पूजा',sub:'शक्ति • श्रद्धा • आनंद',img:'assets/originals/durga-puja-premium.webp',bg:'#7f1d1d'};let cat='All',idx=0,view=all;const C=document.getElementById('cats');['All',...cats].forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{cat=c;idx=0;filter();[...C.children].forEach(x=>x.classList.toggle('on',x===b))};C.appendChild(b)});C.firstChild.classList.add('on');function filter(){let q=document.getElementById('q').value.toLowerCase();view=all.filter(x=>(cat==='All'||x.cat===cat)&&(!q||(x.name+' '+x.title).toLowerCase().includes(q)));if(idx>=view.length)idx=0;show()}function show(){let x=view[idx];if(!x){document.getElementById('title').textContent='No template';return}let p=document.getElementById('poster');p.style.background=x.img?`${x.bg} url('${x.img}') center/cover no-repeat`:x.bg;document.getElementById('title').textContent=x.title;document.getElementById('sub').textContent=x.sub;document.getElementById('counter').textContent=(idx+1)+' / '+view.length}document.getElementById('prev').onclick=()=>{idx=(idx-1+view.length)%view.length;show()};document.getElementById('next').onclick=()=>{idx=(idx+1)%view.length;show()};document.getElementById('q').oninput=()=>{idx=0;filter()};document.getElementById('use').onclick=()=>{let x=view[idx];localStorage.setItem('apanamChosenOriginal',JSON.stringify(x));location.href='./?original='+(all.indexOf(x)+1)};show()</script></body></html>
