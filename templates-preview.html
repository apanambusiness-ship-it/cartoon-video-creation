<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APANAM Ready Templates</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#142033}header{background:linear-gradient(110deg,#081426,#172554,#4c1d95);color:#fff;padding:16px 26px;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5}header b{font-size:27px;color:#42a5ff}header small{font-size:15px}.search{margin-left:auto;width:min(360px,35vw);padding:12px 15px;border:0;border-radius:9px}.hero{padding:24px 22px 15px;background:#fff;border-bottom:1px solid #e2e8f0}.hero h1{margin:0 0 6px;font-size:28px;color:#172554}.hero p{margin:0;color:#64748b}.wrap{padding:16px 22px}.sectionTitle{display:flex;align-items:end;justify-content:space-between;margin:4px 0 10px}.sectionTitle h2{margin:0;font-size:19px}.sectionTitle span{font-size:12px;color:#64748b}.cats,.sizes,.styles{display:flex;gap:8px;overflow:auto;padding:5px 0 9px}.filter{border:1px solid #d7deea;background:#fff;border-radius:9px;padding:9px 14px;white-space:nowrap;cursor:pointer}.filter.active{background:#2563eb;color:#fff}.line{display:flex;align-items:center;gap:12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:14px}.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px #17203318;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #17203325}.card footer{padding:9px 10px;font-size:11px;font-weight:700}.use{float:right;color:#6d28d9}.od{aspect-ratio:1/1;position:relative;overflow:hidden;color:#fff;padding:17px;display:flex;flex-direction:column}.od h2{font-size:25px;line-height:1;margin:7px 0;max-width:90%;position:relative;z-index:2}.od p{font-size:10px;position:relative;z-index:2}.od small{font-weight:800;letter-spacing:1.5px;position:relative;z-index:2}.od strong{position:absolute;bottom:18px;left:17px;background:#fff;color:var(--a);padding:7px 10px;border-radius:20px;font-size:9px;z-index:2}.od i,.od b{font-style:normal;font-size:38px;position:relative;z-index:2}.od1{background:linear-gradient(145deg,var(--a),var(--b));justify-content:center}.od1>span{position:absolute;width:130px;height:130px;border:22px solid #fff2;border-radius:50%;right:-35px;top:-30px}.od2{background:var(--a);justify-content:center;align-items:center;text-align:center}.od2>span{position:absolute;inset:14px;border:1px solid #fff6;border-radius:50% 50% 10px 10px}.od2 strong{left:50%;transform:translateX(-50%)}.od3{background:linear-gradient(160deg,#fff 0 35%,var(--a) 35% 100%);color:#fff;padding-top:18px}.od3 b{color:var(--a)}.od3 small{color:var(--a)}.od3 h2{margin-top:45px}.od3 em{position:absolute;right:15px;top:18px;color:var(--a);font-size:9px;font-weight:900}.od4{background:linear-gradient(135deg,var(--a),var(--b));justify-content:center}.od4 i{position:absolute;right:18px;top:20px;font-size:55px}.od4 h2{max-width:70%}.od4>span{position:absolute;width:170px;height:170px;background:#fff1;border-radius:50%;right:-60px;bottom:-60px}.empty{text-align:center;padding:50px;grid-column:1/-1}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.search{margin:0;width:100%}.hero h1{font-size:23px}.line{align-items:flex-start;flex-direction:column;gap:2px}.od h2{font-size:20px}}</style></head><body><header><div><b>APANAM</b><br><small>AI Creative Studio</small></div><input class="search" id="search" placeholder="Search templates..."></header><section class="hero"><h1>🎨 Ready Templates & Themes</h1><p>अपनी category चुनें, original design देखें और पसंद का template edit करने के लिए चुनें।</p></section><div class="wrap"><div class="sectionTitle"><h2>Browse by Category</h2><span id="total"></span></div><div class="cats" id="cats"></div><div class="line"><strong>Size:</strong><div class="sizes"><button class="filter active">All</button><button class="filter">Square 1:1</button><button class="filter">Portrait 4:5</button><button class="filter">Story 9:16</button><button class="filter">Landscape 16:9</button></div></div><div class="line"><strong>Style:</strong><div class="styles"><button class="filter active">All</button><button class="filter">Modern</button><button class="filter">Minimal</button><button class="filter">Elegant</button><button class="filter">Traditional</button><button class="filter">Bold</button><button class="filter">Colorful</button></div></div><div class="sectionTitle"><h2 id="categoryHeading">All Templates</h2><span>Original APANAM collection</span></div><div class="grid" id="grid"></div></div><script src="template-library-data.js?v=7"></script><script src="template-original-designs.js?v=2"></script><script>const L=window.APANAM_TEMPLATE_LIBRARY||{},D=window.APANAM_ORIGINAL_DESIGNS;const cats=document.getElementById('cats'),grid=document.getElementById('grid'),search=document.getElementById('search'),heading=document.getElementById('categoryHeading'),total=document.getElementById('total');let active='All';total.textContent=Object.values(L).reduce((a,x)=>a+x.length,0)+' templates';['All',...Object.keys(L)].forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;heading.textContent=c==='All'?'All Templates':c+' Templates';[...cats.children].forEach(x=>x.classList.toggle('active',x===b));render()};cats.appendChild(b)});function choose(c,n,i){const t=D.theme(c),data={category:c,name:n,index:i,icon:t.icon,a:t.a,b:t.b,tag:t.tag};localStorage.setItem('apanamTemplateChoice',JSON.stringify(data));if(window.opener&&!window.opener.closed){window.opener.location.href='index.html?template='+encodeURIComponent(c+'|'+n)+'&v=published';window.opener.focus();setTimeout(()=>window.close(),250)}else location.href='index.html?template='+encodeURIComponent(c+'|'+n)+'&v=published'}function render(){grid.innerHTML='';const q=search.value.toLowerCase();let items=[];Object.entries(L).forEach(([c,names])=>{if(active==='All'||active===c)names.forEach((n,i)=>{if((n+' '+c).toLowerCase().includes(q))items.push([c,n,i])})});items.forEach(([c,n,i])=>{const d=document.createElement('article');d.className='card';d.innerHTML=D.markup(c,n,i)+`<footer>${c} · ${n}<span class="use">Use & Edit →</span></footer>`;d.onclick=()=>choose(c,n,i);grid.appendChild(d)});if(!items.length)grid.innerHTML='<div class="empty">कोई template नहीं मिला</div>'}search.oninput=render;render();</script></body></html>
