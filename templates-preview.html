<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>APANAM Template Gallery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#142033}header{background:linear-gradient(110deg,#081426,#172554,#4c1d95);color:#fff;padding:18px 26px;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:5}header b{font-size:27px;color:#42a5ff}header small{font-size:15px}.search{margin-left:auto;width:min(360px,35vw);padding:12px 15px;border:0;border-radius:9px}.wrap{padding:16px 22px}.cats,.sizes,.styles{display:flex;gap:8px;overflow:auto;padding:5px 0 9px}.filter{border:1px solid #d7deea;background:#fff;border-radius:9px;padding:9px 14px;white-space:nowrap;cursor:pointer}.filter.active{background:#2563eb;color:#fff}.line{display:flex;align-items:center;gap:12px;font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(160px,1fr));gap:14px}.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px #17203318;cursor:pointer;transition:.18s}.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px #17203325}.poster{aspect-ratio:1/1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:18px;color:#fff;position:relative}.poster:after{content:'APANAM';position:absolute;bottom:12px;right:12px;font-size:9px;opacity:.7}.poster h2{margin:0;font-size:25px;line-height:1.05}.poster p{font-size:12px;max-width:90%}.card footer{padding:9px 10px;font-size:12px;font-weight:700}.use{float:right;color:#6d28d9}.empty{text-align:center;padding:50px;grid-column:1/-1}@media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}.search{margin:0;width:100%}}</style></head><body><header><div><b>APANAM</b><br><small>AI Creative Studio · Template Gallery Test</small></div><input class="search" id="search" placeholder="Search templates..."></header><div class="wrap"><div class="cats" id="cats"></div><div class="line"><strong>Size:</strong><div class="sizes"><button class="filter active">All</button><button class="filter">Square 1:1</button><button class="filter">Portrait 4:5</button><button class="filter">Story 9:16</button><button class="filter">Landscape 16:9</button></div></div><div class="line"><strong>Style:</strong><div class="styles"><button class="filter active">All</button><button class="filter">Modern</button><button class="filter">Minimal</button><button class="filter">Elegant</button><button class="filter">Traditional</button><button class="filter">Bold</button><button class="filter">Colorful</button></div></div><div class="grid" id="grid"></div></div><script src="template-library-data.js?v=4"></script><script>const L=window.APANAM_TEMPLATE_LIBRARY||{};const cats=document.getElementById('cats'),grid=document.getElementById('grid'),search=document.getElementById('search');let active='All';const palettes=[['#4c0519','#f59e0b'],['#831843','#f9a8d4'],['#0f172a','#2563eb'],['#052e16','#ea580c'],['#075985','#38bdf8'],['#581c87','#ec4899'],['#713f12','#fde047'],['#064e3b','#4ade80']];['All',...Object.keys(L)].forEach(c=>{const b=document.createElement('button');b.className='filter'+(c==='All'?' active':'');b.textContent=c;b.onclick=()=>{active=c;[...cats.children].forEach(x=>x.classList.toggle('active',x===b));render()};cats.appendChild(b)});function render(){grid.innerHTML='';const q=search.value.toLowerCase();let items=[];Object.entries(L).forEach(([c,names])=>{if(active==='All'||active===c)names.forEach((n,i)=>{if((n+' '+c).toLowerCase().includes(q))items.push([c,n,i])})});items.forEach(([c,n,i],k)=>{const p=palettes[(k+i)%palettes.length],d=document.createElement('article');d.className='card';d.innerHTML=`<div class="poster" style="background:linear-gradient(145deg,${p[0]},${p[1]})"><h2>${n}</h2><p>${c} creative template<br>अपना टेक्स्ट यहाँ लिखें</p></div><footer>${c} · ${n}<span class="use">Use & Edit →</span></footer>`;grid.appendChild(d)});if(!items.length)grid.innerHTML='<div class="empty">कोई template नहीं मिला</div>'}search.oninput=render;render();</script></body></html>
